name: .NET Release

on:
  release:
    types: [published]

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet publish EndpointMapper --no-restore --property:ContinuousIntegrationBuild=true
    - name: Get the release tag
      id: get_release_tag
      run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    - name: Upload artifact to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload ${{ steps.get_release_tag.outputs.tag }} artifacts/package/release/* --clobber

